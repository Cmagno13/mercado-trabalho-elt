name: mercado-trabalho-elt

x-warehouse-env: &warehouse-env
  WAREHOUSE_HOST: postgres
  WAREHOUSE_PORT: "5432"
  WAREHOUSE_USER: ${POSTGRES_USER}
  WAREHOUSE_PASSWORD: ${POSTGRES_PASSWORD}
  WAREHOUSE_DB: warehouse
  WAREHOUSE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/warehouse

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: warehouse
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d warehouse"]
      interval: 5s
      retries: 20

  airflow:
    build: docker/airflow
    command: standalone
    environment:
      <<: *warehouse-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # Demonstração local: sem tela de login. Não use assim fora da sua máquina.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      PYTHONPATH: /opt/project
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./ingestion:/opt/project/ingestion:ro
      - ./dbt:/opt/project/dbt:ro
    depends_on:
      postgres:
        condition: service_healthy

  superset:
    build: docker/superset
    environment: &superset-env
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/superset
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    command:
      - /bin/sh
      - -c
      - |
        superset db upgrade &&
        superset fab create-admin --username "$$SUPERSET_ADMIN_USER" --password "$$SUPERSET_ADMIN_PASSWORD" \
          --firstname Admin --lastname Local --email admin@example.com || true
        superset init &&
        /usr/bin/run-server.sh
    ports:
      - "8089:8088"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8088/health"]
      interval: 10s
      retries: 30
      start_period: 60s

  # Executa uma vez: registra o warehouse no Superset e cria datasets, gráficos e o dashboard.
  superset-bootstrap:
    build: docker/superset
    environment:
      <<: *superset-env
      SUPERSET_URL: http://superset:8088
      WAREHOUSE_SQLALCHEMY_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/warehouse
    command: ["python", "/app/bootstrap/bootstrap_dashboard.py"]
    volumes:
      - ./superset:/app/bootstrap:ro
    depends_on:
      superset:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
